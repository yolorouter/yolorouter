# CI: runs on every push to main and on pull requests.
# The release workflow (release.yml) is separate and triggers on v* tags.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  # Runs the same suite on a real Windows host. Cross-compiling for windows
  # (see the build job) only proves the code compiles; it cannot catch
  # behavior that differs at runtime, which is how a config-permission check
  # that rejects every Windows file shipped in release archives unnoticed.
  # Tests asserting unix permission bits skip themselves on windows.
  test-windows:
    name: Test (Go, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        # The Windows runners run the same suite 5-15x slower than linux
        # ones (Defender scans every spawn and file op; the package
        # binaries run in parallel and contend for one disk), so the
        # heaviest packages (gateway, handler) sit near the default 10m
        # per-package budget and tip over on busy runners — twice in three
        # days, each time with a dump showing only benign waiters (log
        # rotators, sql pool) and a rerun passing. A hang still fails, 10
        # minutes later; a load-shaped flake stops failing the build.
        run: go test ./... -timeout 20m

  # Every other test in the suite runs on SQLite, so migrations/postgres was
  # reaching production without ever being executed: a typo, an unsupported
  # clause or a broken Down would first surface on a user's live database during
  # an upgrade. This job applies the whole tree, rolls it back and re-applies it
  # against a real server. Tests needing the DSN skip themselves without it, so
  # the local suite is unaffected.
  test-postgres:
    name: Test (Go, Postgres migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yolorouter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: go test (database)
        env:
          TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/yolorouter_test?sslmode=disable
        run: go test ./pkg/database/...

  lint:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      # v7+ of the action is required to run golangci-lint v2, which is what
      # our .golangci.yml (version: "2") targets; v6 only supports v1.
      #
      # Pinned, not "latest". golangci-lint bundles the gofmt of whatever Go
      # it was built against, so a floating version silently moves the
      # formatting rules ahead of the Go this repo targets — and the same
      # file then fails `gofmt -l` locally or the lint job here, depending on
      # which side you satisfy. Bump this deliberately, alongside go-version
      # above and go.mod, so one formatter governs everywhere.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.1

  build:
    name: Build (embedded binary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Builds the frontend (incl. vue-tsc type-check) and copies it into
      # web/dist so the -tags embed build below can go:embed a real UI.
      - name: Build frontend + embed
        run: make embed-frontend
      - name: Build embedded binary
        run: go build -tags embed -o /dev/null ./cmd/yolorouter
      - name: Cross-compile check (windows)
        run: GOOS=windows GOARCH=amd64 go build ./...
