# 仅作示例参考；实际运行时如果 configs/config.yaml 不存在，
# yolorouter 会用内置默认值自动生成一份（含随机生成的
# security.provider_master_key），不需要手动复制这个文件。
#
# 如果确实要直接复制这份文件当作 --config 使用：文件权限必须是 600
# （chmod 600，否则会被拒绝加载），并且下面的 provider_master_key 必须
# 换成一个真实的 base64 编码 32 字节 AES-256 密钥——留空只在"配置文件不
# 存在、走自动生成"这条路径下才会被程序自动填充，一旦文件本身存在，空
# 值会直接报错，不会静默补全。
server:
  port: 8080
  # external_url: "https://router.example.com"
  # 浏览器访问本实例的外部地址。设置后，外部登录（OAuth）的回调地址
  # 以它为准；留空则按每个请求的 Host 头推导（单机/内网零配置够用，
  # 但 Host 头是客户端可控的——凡是暴露到公网的部署都应显式设置）。
database:
  driver: sqlite       # sqlite | postgres
  # 相对路径按这个配置文件自身所在目录解析，不是进程 cwd —— "../data" 落在
  # 仓库顶层的 data/ 目录（configs/ 的同级目录），跟内置默认值一致；如果写成
  # "./data/yolorouter.db"，实际会落到 configs/data/ 里，跟自动生成场景的
  # 默认位置不一样
  sqlite_path: ../data/yolorouter.db
  # host, port, user, password, dbname, sslmode 仅在 driver: postgres 时需要
  # sslmode: disable | allow | prefer | require | verify-ca | verify-full
  # 本地开发用 disable 即可；远程/生产部署应显式设为 require 或 verify-full，
  # 否则凭据和数据会以明文传输
  sslmode: disable
log:
  level: info
security:
  provider_master_key: ""  # 留空；自动生成场景下由程序填充，不要手写
  # Let connection tests AND gateway relay dial loopback / private / link-local
  # / CGNAT addresses (e.g. a local Ollama / vLLM / LM Studio / one-api).
  # Default false = block them (SSRF defense; multicast/reserved/unspecified
  # stay blocked even when this is on). Only enable on a single-tenant,
  # self-hosted deployment you control — never when internet-exposed or
  # multi-tenant, or a provider base_url could reach internal services and
  # cloud metadata endpoints (169.254.169.254).
  allow_private_upstreams: false
update:
  enabled: true        # set false to fully disable the update-check API and the `update` CLI
  # GitHub release source as "owner/repo"; empty falls back to the binary's
  # compiled-in default (injected via ldflags at release time). Forks can
  # override it here.
  github_repo: ""
# Built-in model price catalog refresh. The seed is embedded in the binary at
# compile time (refreshed once per release from the data repo); a background
# goroutine fetches a fresher catalog daily from the distribution endpoint and
# hot-swaps it in (the embedded seed stays as a fallback when the endpoint is
# unreachable). The default endpoint is live, so every instance refreshes with
# zero config — set endpoint to "" to disable, or to your own URL to self-host
# the source (e.g. a jsDelivr mirror of github.com/yolorouter/price-catalog).
price_catalog:
  endpoint: "https://prices.yolorouter.com/catalog.json"
  refresh_interval: 24h
# Gateway (upstream relay) budgets. Every field defaults to the value shown
# below when absent, so an existing config without a `gateway:` section
# upgrades automatically. All fields must be > 0. Required timeout ordering
# (only the pairs that reflect a real same-attempt nesting relationship):
# header_timeout <= attempt_timeout, first_byte_timeout <= attempt_timeout,
# and attempt_timeout < request_timeout. connect_timeout and
# body_idle_timeout bound independent phases (TCP dial, and the inter-chunk
# gap once the body is already streaming) and are not ordered against each
# other or against header_timeout — set each to whatever your network and
# upstreams actually need.
gateway:
  connect_timeout: 5s       # TCP dial timeout
  header_timeout: 600s      # request sent -> response header (TLS handshake is separate; controlled by tls_handshake_timeout)
  first_byte_timeout: 600s  # response header -> first body chunk (reasoning "thinking" phase; transport.ResponseHeaderTimeout cannot cover this gap)
  body_idle_timeout: 60s    # max gap between two response chunks (nginx proxy_read_timeout style)
  attempt_timeout: 20m      # hard wall for a single upstream attempt (one key on one candidate)
  request_timeout: 30m      # total budget spanning all failover candidates
  tls_handshake_timeout: 10s # TLS handshake (transport.TLSHandshakeTimeout)
  max_upstream_attempts: 3  # count cap on upstream dispatches per request, across all candidates and key rotations (first dispatch + retries)
  max_candidate_probes: 20  # count cap on candidates abandoned before anything was sent (e.g. a rewriter refusing the candidate)
  circuit_failure_threshold: 5 # consecutive provider faults that open its breaker (traffic then skips the provider)
  circuit_success_threshold: 2 # successful probes that close an open breaker again
  circuit_open_timeout: 60s    # how long an open breaker refuses traffic before probe requests are let through
  key_rate_limit_cooldown: 60s # how long a plain-429 key is demoted behind healthy ones in its provider's pool (Retry-After honoured, clamped to 1s~10m)
